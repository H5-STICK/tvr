
name: Actualizar TVR

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-tvr
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Obtener enlaces y actualizar TVR
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request
          from pathlib import Path

          origen = "https://www.dailymotion.com/video/x8dhao1"

          def obtener(formato):
              resultado = subprocess.check_output(
                  [
                      "yt-dlp",
                      "--no-config",
                      "-f", formato,
                      "-g", origen
                  ],
                  text=True
              )
              urls = [
                  linea.strip()
                  for linea in resultado.splitlines()
                  if linea.strip().startswith("http")
              ]
              if len(urls) != 1:
                  raise RuntimeError(
                      f"Formato {formato}: se esperaba una URL"
                  )
              return urls[0]

          video = obtener("hls-3")
          audio = obtener("hls-group_A2-und")

          if video == audio:
              raise RuntimeError("Video y audio son iguales")

          for nombre, url in [
              ("VIDEO", video),
              ("AUDIO", audio)
          ]:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  ),
                  timeout=30
              ) as respuesta:
                  contenido = respuesta.read(4096)
                  if respuesta.status != 200:
                      raise RuntimeError(
                          f"{nombre}: HTTP {respuesta.status}"
                      )
                  if not contenido.startswith(b"#EXTM3U"):
                      raise RuntimeError(
                          f"{nombre}: no es un M3U8"
                      )
                  if b"#EXTINF:" not in contenido:
                      raise RuntimeError(
                          f"{nombre}: no contiene segmentos"
                      )
                  print(f"{nombre}: manifiesto correcto")

          playlist = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:6\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Español",DEFAULT=YES,'
              f'AUTOSELECT=YES,URI="{audio}"\n'
              "#EXT-X-STREAM-INF:BANDWIDTH=3500000,"
              "AVERAGE-BANDWIDTH=2500000,"
              "RESOLUTION=1280x720,"
              'CODECS="avc1.64001f,mp4a.40.2",'
              'AUDIO="audio"\n'
              f"{video}\n"
          )

          Path("tvr.m3u8").write_text(
              playlist,
              encoding="utf-8"
          )
          print("tvr.m3u8 actualizado")
          PY

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tvr.m3u8

          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Renovar enlaces TVR"
            git push
          fi
